# =========================================
# SERVER
# =========================================
server.port=${PORT:${SERVER_PORT:8080}}
server.address=0.0.0.0
# Render는 TLS를 프록시에서 종료하고 컨테이너로는 HTTP로 전달하므로,
# X-Forwarded-* 헤더를 신뢰해야 OAuth2 redirect_uri가 https로 정확히 계산됨.
server.forward-headers-strategy=framework
# =========================================
# APPLICATION
# =========================================
spring.application.name=commitmate

# =========================================
# DATABASE
# =========================================
spring.datasource.url=jdbc:mysql://fine-todo-finetodo.c.aivencloud.com:21800/defaultdb?ssl-mode=REQUIRED&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# [??] db/data.sql ?? ?? ? ?? ??
spring.sql.init.data-locations=classpath:db/data.sql
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# =========================================
# JPA
# =========================================
# ???? ?? ?? ????? create? ?? (??? ?? ? update? ?? ??)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate SQL Log
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

# =========================================
# MUSTACHE (?? Thymeleaf ?? ??)
# =========================================
# Mustache ??? ???? ?? ?? ??????.
spring.mustache.prefix=classpath:/templates/
spring.mustache.suffix=.mustache
spring.mustache.cache=false
# HTML ?? ???? ???? ??? ? suffix? .html? ??? ???.

# =========================================
# FILE UPLOAD
# =========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =========================================
# ENCODING
# =========================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# =========================================
# JWT
# =========================================
jwt.secret=commitmate-secret-key

# =========================================
# LOGGING
# =========================================
logging.level.root=info
logging.level.com.example.commitmate=debug

# PASSWORD RESET MAIL (환경 변수로 설정)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# =========================================
# SMS (SOLAPI) - 휴대폰 인증번호 발송
# =========================================
solapi.api-key=${SOLAPI_API_KEY:}
solapi.api-secret=${SOLAPI_API_SECRET:}
solapi.sender-number=${SOLAPI_SENDER_NUMBER:}

# =========================================
# OAUTH2 (GOOGLE) - 소셜 로그인
# =========================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
