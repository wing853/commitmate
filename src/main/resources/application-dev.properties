# =========================================
# SERVER
# =========================================
server.port=80
# =========================================
# APPLICATION
# =========================================
spring.application.name=commitmate

# =========================================
# DATABASE
# =========================================
spring.datasource.url=jdbc:mysql://localhost:3306/commit_mate?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# [??] db/data.sql ?? ?? ? ?? ??
spring.sql.init.data-locations=classpath:db/data.sql
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# =========================================
# JPA
# =========================================
# ???? ?? ?? ????? create? ?? (??? ?? ? update? ?? ??)
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate SQL Log
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

# =========================================
# MUSTACHE (?? Thymeleaf ?? ??)
# =========================================
# Mustache ??? ???? ?? ?? ??????.
spring.mustache.prefix=classpath:/templates/
spring.mustache.suffix=.mustache
spring.mustache.cache=false
# HTML ?? ???? ???? ??? ? suffix? .html? ??? ???.

# =========================================
# FILE UPLOAD
# =========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =========================================
# ENCODING
# =========================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# =========================================
# JWT
# =========================================
jwt.secret=commitmate-secret-key

# =========================================
# LOGGING
# =========================================
logging.level.root=info
logging.level.com.example.commitmate=debug

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile