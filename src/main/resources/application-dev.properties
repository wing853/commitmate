# =========================================
# SERVER
# =========================================
server.port=5000

# =========================================
# APPLICATION
# =========================================
spring.application.name=commitmate

# =========================================
# DATABASE
# =========================================
spring.datasource.url=jdbc:mysql://localhost:3306/todo?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================
# JPA
# =========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate SQL Log
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

# =========================================
# THYMELEAF
# =========================================
spring.thymeleaf.cache=false

# =========================================
# FILE UPLOAD
# =========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =========================================
# ENCODING
# =========================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# =========================================
# JWT
# =========================================
jwt.secret=commitmate-secret-key

# =========================================
# LOGGING
# =========================================
logging.level.root=info
logging.level.com.example.commitmate=debug